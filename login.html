<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen | Tresor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<!-- CSS staat inline: styles.css is achter de login niet bereikbaar -->
<style>
:root{--ink:#2A1C24;--cream:#FFF8F4;--orange:#FD6432;--orange-30:#FEA88C;--line-dark:rgba(255,248,244,.18);--muted:rgba(255,248,244,.66);--font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.6;background:var(--ink);color:var(--cream);overflow:hidden}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.stage{position:relative;min-height:100%;display:grid;place-items:center;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px));isolation:isolate}
.sun{position:absolute;z-index:-1;width:min(70vw,640px);aspect-ratio:1;border-radius:50%;background:var(--orange);right:-18vw;bottom:-30vw;opacity:.9}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 60% 50% at 80% 100%,rgba(253,100,50,.25),transparent 70%)}
.box{width:100%;max-width:440px;text-align:center}
.wordmark{display:inline-flex;align-items:center;font-size:clamp(48px,11vw,88px);font-weight:500;letter-spacing:.1em;line-height:1;margin:0 0 32px}
.disc{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:radial-gradient(circle,var(--ink) 0 17%,var(--orange) 18%);margin:0 .12em 0 .02em}
.label{display:block;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
h1{font-size:28px;font-weight:300;line-height:1.15;margin:12px 0 8px}
.intro{color:var(--muted);margin:0 0 32px}
form{text-align:left}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;min-height:52px;font:400 16px/1.4 var(--font);color:var(--ink);background:var(--cream);border:2px solid transparent;border-radius:12px;padding:12px 88px 12px 14px}
input:focus{outline:none;border-color:var(--orange)}
input[aria-invalid=true]{border-color:var(--orange-30)}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 14px/1 var(--font);cursor:pointer}
.toggle:hover{background:rgba(42,28,36,.08)}
.err{color:var(--orange-30);font-size:14px;margin:8px 0 0}
.btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:52px;margin-top:20px;border:0;border-radius:999px;background:var(--orange);color:var(--ink);font:600 16px/1 var(--font);cursor:pointer}
.btn:hover{background:#FD865F}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
.foot a{color:var(--cream)}
@media (prefers-reduced-motion:no-preference){.box{animation:in .8s cubic-bezier(.2,.7,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="stage">
  <div class="sun" aria-hidden="true"></div>
  <div class="box">
    <p class="wordmark" aria-label="Tresor">TRES<span class="disc" aria-hidden="true"></span>R</p>
    <span class="label">Preview</span>
    <h1>Deze site is nog in opbouw</h1>
    <p class="intro">Log in met het wachtwoord om de preview te bekijken.</p>

    <form method="post" action="/api/login">
      <input type="hidden" name="next" id="next" value="/">
      <label for="wachtwoord">Wachtwoord</label>
      <div class="pw">
        <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required autofocus aria-describedby="err">
        <button class="toggle" type="button" aria-controls="wachtwoord" aria-pressed="false">Toon</button>
      </div>
      <p class="err" id="err" role="alert" hidden>Dit wachtwoord klopt niet. Probeer het opnieuw.</p>
      <button class="btn" type="submit">Bekijk de site</button>
    </form>

    <p class="foot">Geen wachtwoord? Mail <a href="mailto:info@tresor.nl">info@tresor.nl</a></p>
  </div>
</main>
<script>
const q=new URLSearchParams(location.search);
const n=q.get('next')||'/';
document.getElementById('next').value=(n.startsWith('/')&&!n.startsWith('//'))?n:'/';
if(q.get('fout')){const e=document.getElementById('err');e.hidden=false;document.getElementById('wachtwoord').setAttribute('aria-invalid','true');}
const t=document.querySelector('.toggle'),pw=document.getElementById('wachtwoord');
t.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';t.textContent=show?'Verberg':'Toon';t.setAttribute('aria-pressed',show);pw.focus();});
</script>
</body>
</html>
